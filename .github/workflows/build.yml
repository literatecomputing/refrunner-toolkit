name: Build

# Every push: unit tests, the Playwright smoke test, and the Web Store zip as a run artifact.
# A tag like v2026.10.3.1 also attaches the zip to a GitHub release.
# ponytail: uploading to the Chrome Web Store stays manual; automate it with the Web Store API
# (OAuth client + refresh token as secrets) if releases get frequent.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # for the release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          NO_COLOR: 1
      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: refrunner-toolkit
          path: dist/refrunner-toolkit.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/refrunner-toolkit.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
