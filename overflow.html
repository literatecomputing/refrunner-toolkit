<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Send to RefRunner</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 32px 16px; }
    main { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    textarea { min-height: 50vh; font-family: var(--mono); font-size: 12px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <h1>This list is too long to send as a link</h1>
    <p class="muted">
      Links to RefRunner are limited to about 8,000 characters. Copy the text below,
      then paste it into RefRunner's check page.
    </p>
    <textarea id="refs" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn primary" id="go">Copy and open RefRunner</button>
      <span class="muted" id="count"></span>
    </div>
  </main>
  <script type="module" src="overflow.js"></script>
</body>
</html>
